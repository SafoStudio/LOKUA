/api/v1/geo/locations:
  post:
    tags: [Geolocation]
    summary: Create a location
    description: |
      Creates a location with exact and (optionally) public coordinates.
      The authenticated account is recorded as the creator.
    security:
      - CookieAuth: []
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateLocationRequest'
    responses:
      '201':
        description: Location created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationResponse'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationErrorResponse'
      '401':
        description: Authentication required
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Inactive account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: Invalid location data
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/geo/locations/nearby:
  get:
    tags: [Geolocation]
    summary: Search locations nearby
    description: Excludes locations associated with events whose addresses are hidden.
    parameters:
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: radiusMeters
        in: query
        required: false
        schema:
          type: number
          maximum: 100000
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
    responses:
      '200':
        description: Locations found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearbyLocationListResponse'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationErrorResponse'

/api/v1/geo/locations/bbox:
  get:
    tags: [Geolocation]
    summary: Search locations in a bounding box
    description: Excludes locations associated with events whose addresses are hidden.
    parameters:
      - name: minLat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: minLng
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: maxLat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: maxLng
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
    responses:
      '200':
        description: Locations found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationListResponse'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationErrorResponse'

/api/v1/geo/locations/{id}:
  get:
    tags: [Geolocation]
    summary: Get location by id
    description: |
      Returns the location. When precision=PUBLIC (default), only public coordinates
      are returned and address is omitted. When precision=EXACT, exact coordinates
      and the address are returned to an authenticated active account for public
      catalog locations or locations it owns.
      Account-owned locations are excluded from public searches.
      Locations associated with an event whose address is hidden are served through
      the event card. An account may still request its own location with EXACT precision.
    security:
      - {}
      - CookieAuth: []
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: precision
        in: query
        required: false
        schema:
          type: string
          enum: [EXACT, PUBLIC]
          default: PUBLIC
    responses:
      '200':
        description: Location found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationResponse'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationErrorResponse'
      '404':
        description: Location not found or restricted by event address privacy
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '401':
        description: Authentication required for EXACT precision
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Inactive account requesting EXACT precision
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/geo/geocode:
  post:
    tags: [Geolocation]
    summary: Geocode an address
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GeocodeAddressRequest'
    responses:
      '200':
        description: Geocoding result
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeocodeResponse'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationErrorResponse'
      '404':
        description: Address could not be geocoded
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429': { description: Too many geocoding requests }
      '502': { description: Invalid response from the geocoding provider }
      '503': { description: Geocoding provider unavailable or busy }
      '504': { description: Geocoding provider timed out }

/api/v1/geo/reverse-geocode:
  post:
    tags: [Geolocation]
    summary: Reverse geocode coordinates
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReverseGeocodeRequest'
    responses:
      '200':
        description: Reverse geocoding result
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeocodeResponse'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationErrorResponse'
      '404':
        description: Coordinates could not be reverse-geocoded
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '429': { description: Too many geocoding requests }
      '502': { description: Invalid response from the geocoding provider }
      '503': { description: Geocoding provider unavailable or busy }
      '504': { description: Geocoding provider timed out }
