/api/v1/events:
  get:
    tags: [Events]
    summary: List published events
    description: Anonymous visitors see unrestricted events. Signed-in visitors also see events allowed by their age.
    security:
      - {}
      - CookieAuth: []
      - BearerAuth: []
    parameters:
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      - name: cursor
        in: query
        schema: { type: string, minLength: 1 }
      - name: categoryId
        in: query
        schema: { type: string, format: uuid }
      - name: format
        in: query
        schema: { type: string, enum: [OFFLINE, ONLINE] }
    responses:
      '200':
        description: Page of published events
        content:
          application/json:
            schema:
              type: object
              required: [data, pagination]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/PublicEvent'
                pagination:
                  type: object
                  required: [nextCursor, hasMore]
                  properties:
                    nextCursor: { type: [string, 'null'] }
                    hasMore: { type: boolean }
      '400':
        description: Invalid query or pagination cursor
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/ValidationErrorResponse'
                - $ref: '#/components/schemas/ErrorResponse'
      '401': &eventUnauthorized
        description: Invalid or expired credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403': &eventForbidden
        description: Inactive account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  post:
    tags: [Events]
    summary: Create an event draft
    description: Requires an active account with verified email, completed onboarding, and the applicable minimum age.
    security:
      - CookieAuth: []
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateEventRequest'
    responses:
      '201':
        description: Event draft created
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/EventDraft'
      '400': &eventValidation
        description: Request validation failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationErrorResponse'
      '401':
        description: Authentication required or credentials rejected
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Account is ineligible to create this event
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: Event dates, format or price violate a domain rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/events/{id}:
  get:
    tags: [Events]
    summary: Get a visible event or your own draft
    security:
      - {}
      - CookieAuth: []
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Published event visible to the visitor or a draft owned by the caller
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  anyOf:
                    - $ref: '#/components/schemas/EventDraft'
                    - $ref: '#/components/schemas/PublicEvent'
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404':
        description: Event is missing or unavailable to the visitor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  patch:
    tags: [Events]
    summary: Update your draft or active published event
    security: &eventOwnerSecurity
      - CookieAuth: []
      - BearerAuth: []
    parameters: &eventIdParameters
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateEventRequest'
    responses:
      '200': &eventManaged
        description: Updated event
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ManagedEvent'
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': &eventNotOwned
        description: Event is missing or unavailable to the caller
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409': &eventConflict
        description: Event state or participation conflicts with the operation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422': &eventDomainError
        description: Event violates a domain rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  delete:
    tags: [Events]
    summary: Delete your event if it has no participant history
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    responses:
      '204':
        description: Event deleted
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': *eventNotOwned
      '409': *eventConflict

/api/v1/events/{id}/publish:
  post:
    tags: [Events]
    summary: Publish your draft
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    responses:
      '200': *eventManaged
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': *eventNotOwned
      '409': *eventConflict
      '422': *eventDomainError

/api/v1/events/{id}/cancel:
  post:
    tags: [Events]
    summary: Cancel your event
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 300 }
    responses:
      '200': *eventManaged
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': *eventNotOwned
      '409': *eventConflict

/api/v1/events/{id}/duplicate:
  post:
    tags: [Events]
    summary: Duplicate your event as a draft without dates
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    responses:
      '201':
        description: Draft created
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/EventDraft'
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': *eventNotOwned
      '422': *eventDomainError
