/api/v1/events:
  get:
    tags: [Events]
    summary: List upcoming events by start time
    description: >
      Lists future published and full events in ascending start-time order. The first page
      falls back to online events with DATE sorting when no city events match and format is unspecified.
      Use the same filters on subsequent pages. Visibility depends on age, moderation and user blocks.
    security:
      - {}
      - CookieAuth: []
      - BearerAuth: []
    parameters:
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      - name: cursor
        in: query
        schema: { type: string, minLength: 1 }
      - name: cityId
        in: query
        description: Defaults to the signed-in user's profile city or Kyiv.
        schema: { type: string, format: uuid }
      - name: from
        in: query
        description: Inclusive start instant.
        schema: { type: string, format: date-time }
      - name: to
        in: query
        description: Exclusive end instant.
        schema: { type: string, format: date-time }
      - name: period
        in: query
        description: Calendar dates in the selected city's timezone. Weekend includes Saturday and Sunday.
        schema: { type: string, enum: [TODAY, TOMORROW, WEEKEND] }
      - name: freeOnly
        in: query
        schema: { type: boolean, default: false }
      - name: participationMode
        in: query
        schema: { type: string, enum: [FREE, REQUEST] }
      - name: availableOnly
        in: query
        schema: { type: boolean, default: false }
      - name: search
        in: query
        description: Case-insensitive substring of the title, description, or a tag.
        schema: { type: string, minLength: 1, maxLength: 200 }
      - name: categoryId
        in: query
        schema: { type: string, format: uuid }
      - name: format
        in: query
        schema: { type: string, enum: [OFFLINE, ONLINE] }
      - name: sort
        in: query
        description: DISTANCE sorts offline events in the selected city by distance, then start time and ID.
        schema: { type: string, enum: [DATE, DISTANCE], default: DATE }
      - name: latitude
        in: query
        description: Origin latitude. Required with DISTANCE and accepted only with that sort.
        schema: { type: number, minimum: -90, maximum: 90 }
      - name: longitude
        in: query
        description: Origin longitude. Required with DISTANCE and accepted only with that sort.
        schema: { type: number, minimum: -180, maximum: 180 }
    responses:
      '200':
        description: Page of upcoming events
        content:
          application/json:
            schema:
              type: object
              required: [data, pagination]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/FeedEvent'
                pagination:
                  type: object
                  required: [nextCursor, hasMore]
                  properties:
                    nextCursor: { type: [string, 'null'] }
                    hasMore: { type: boolean }
      '400':
        description: Invalid query or pagination cursor
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/ValidationErrorResponse'
                - $ref: '#/components/schemas/ErrorResponse'
      '401': &eventUnauthorized
        description: Invalid or expired credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403': &eventForbidden
        description: Inactive account
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  post:
    tags: [Events]
    summary: Create an event draft
    description: Requires an active account with verified email, completed onboarding, and the applicable minimum age.
    security:
      - CookieAuth: []
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateEventRequest'
    responses:
      '201':
        description: Event draft created
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/EventDraft'
      '400': &eventValidation
        description: Request validation failed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationErrorResponse'
      '401':
        description: Authentication required or credentials rejected
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '403':
        description: Account is ineligible to create this event
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422':
        description: Event dates, format or price violate a domain rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/events/{id}:
  get:
    tags: [Events]
    summary: Get a visible event or your own draft
    security:
      - {}
      - CookieAuth: []
      - BearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      '200':
        description: Published event visible to the visitor or a draft owned by the caller
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  anyOf:
                    - $ref: '#/components/schemas/EventDraft'
                    - $ref: '#/components/schemas/PublicEvent'
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404':
        description: Event is missing or unavailable to the visitor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

  patch:
    tags: [Events]
    summary: Update your draft or active published event
    security: &eventOwnerSecurity
      - CookieAuth: []
      - BearerAuth: []
    parameters: &eventIdParameters
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateEventRequest'
    responses:
      '200': &eventManaged
        description: Updated event
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/ManagedEvent'
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': &eventNotOwned
        description: Event is missing or unavailable to the caller
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409': &eventConflict
        description: Event state or participation conflicts with the operation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '422': &eventDomainError
        description: Event violates a domain rule
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
  delete:
    tags: [Events]
    summary: Delete your event if it has no participant history
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    responses:
      '204':
        description: Event deleted
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': *eventNotOwned
      '409': *eventConflict

/api/v1/events/{id}/publish:
  post:
    tags: [Events]
    summary: Publish your draft
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    responses:
      '200': *eventManaged
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': *eventNotOwned
      '409': *eventConflict
      '422': *eventDomainError

/api/v1/events/{id}/cancel:
  post:
    tags: [Events]
    summary: Cancel your event
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 300 }
    responses:
      '200': *eventManaged
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': *eventNotOwned
      '409': *eventConflict

/api/v1/events/{id}/duplicate:
  post:
    tags: [Events]
    summary: Duplicate your event as a draft without dates
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    responses:
      '201':
        description: Draft created
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/EventDraft'
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404': *eventNotOwned
      '422': *eventDomainError

/api/v1/events/map:
  get:
    tags: [Events]
    summary: List upcoming offline event markers within a viewport
    description: >
      Returns markers ordered by start time and ID. Bounds include their edges and may span
      up to five degrees per axis. The viewport determines the area when cityId is omitted.
      Hidden addresses use rounded public coordinates for both matching and the marker.
      Use the same viewport and filters on subsequent pages.
    security:
      - {}
      - CookieAuth: []
      - BearerAuth: []
    parameters:
      - name: minLat
        in: query
        required: true
        schema: { type: number, minimum: -90, maximum: 90 }
      - name: minLng
        in: query
        required: true
        schema: { type: number, minimum: -180, maximum: 180 }
      - name: maxLat
        in: query
        required: true
        schema: { type: number, minimum: -90, maximum: 90 }
      - name: maxLng
        in: query
        required: true
        schema: { type: number, minimum: -180, maximum: 180 }
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      - name: cursor
        in: query
        schema: { type: string, minLength: 1 }
      - name: cityId
        in: query
        schema: { type: string, format: uuid }
      - name: categoryId
        in: query
        schema: { type: string, format: uuid }
      - name: from
        in: query
        description: Inclusive start instant.
        schema: { type: string, format: date-time }
      - name: to
        in: query
        description: Exclusive end instant.
        schema: { type: string, format: date-time }
      - name: period
        in: query
        description: Uses the selected city, profile city or Kyiv timezone.
        schema: { type: string, enum: [TODAY, TOMORROW, WEEKEND] }
      - name: freeOnly
        in: query
        schema: { type: boolean, default: false }
      - name: participationMode
        in: query
        schema: { type: string, enum: [FREE, REQUEST] }
      - name: availableOnly
        in: query
        schema: { type: boolean, default: false }
      - name: search
        in: query
        schema: { type: string, minLength: 1, maxLength: 200 }
    responses:
      '200':
        description: Page of upcoming offline event markers
        content:
          application/json:
            schema:
              type: object
              required: [data, pagination]
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/EventMapMarker'
                pagination:
                  type: object
                  required: [nextCursor, hasMore]
                  properties:
                    nextCursor: { type: [string, 'null'] }
                    hasMore: { type: boolean }
      '400':
        description: Invalid map query or cursor
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/ValidationErrorResponse'
                - $ref: '#/components/schemas/ErrorResponse'
      '401': *eventUnauthorized
      '403': *eventForbidden

/api/v1/events/{id}/participations:
  post:
    tags: [Events]
    summary: Join a free-entry event
    description: >
      Approves participation immediately for events with participation mode FREE.
      A repeated request returns the existing approval. Schedule overlaps are returned as warnings.
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    responses:
      '200':
        description: Approved participation
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: object
                  required: [participation, warnings]
                  properties:
                    participation:
                      $ref: '#/components/schemas/OwnEventParticipation'
                    warnings:
                      type: array
                      items: { type: string, enum: [SCHEDULE_CONFLICT] }
      '400': *eventValidation
      '401': *eventUnauthorized
      '403':
        description: Account is ineligible to join
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '404':
        description: Event is missing or unavailable to the caller
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: Event is closed or full, requires an application, or participation cannot be reopened
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'

/api/v1/events/{id}/participations/me:
  delete:
    tags: [Events]
    summary: Cancel your participation before the event starts
    security: *eventOwnerSecurity
    parameters: *eventIdParameters
    responses:
      '200':
        description: Cancelled participation
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: '#/components/schemas/OwnEventParticipation'
      '400': *eventValidation
      '401': *eventUnauthorized
      '403': *eventForbidden
      '404':
        description: Event or participation not found
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
      '409':
        description: Event is closed or participation cannot be cancelled
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorResponse'
