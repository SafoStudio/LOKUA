type: object
required: [id, eventId, author, rating, text, organizerReply, organizerReplyAt, isPinned, createdAt]
properties:
  id: { type: string, format: uuid }
  eventId: { type: string, format: uuid }
  author:
    type: object
    required: [id, name, avatarUrl]
    properties:
      id: { type: string, format: uuid }
      name: { type: [string, 'null'] }
      avatarUrl: { type: [string, 'null'] }
  rating: { type: integer, minimum: 1, maximum: 5 }
  text: { type: [string, 'null'], maxLength: 1000 }
  organizerReply: { type: [string, 'null'], maxLength: 1000 }
  organizerReplyAt: { type: [string, 'null'], format: date-time }
  isPinned: { type: boolean }
  createdAt: { type: string, format: date-time }
