User:
  type: object
  required:
    - id
    - email
    - name
    - emailVerified
    - role
    - status
    - onboardingCompleted
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type: string
    emailVerified:
      type: boolean
    role:
      type: string
      enum: [USER, MODERATOR, ADMIN]
    status:
      type: string
      enum: [ACTIVE, BLOCKED_TEMPORARY, BLOCKED_PERMANENT, PENDING_DELETION, DELETED]
    onboardingCompleted:
      type: boolean
    birthDate:
      type: string
      format: date
      nullable: true

UserResponse:
  type: object
  required: [user]
  properties:
    user:
      $ref: '#/components/schemas/User'

UserProfileView:
  type: object
  required:
    - id
    - email
    - name
    - interestIds
    - onboardingCompleted
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
    name:
      type: string
    avatarUrl:
      type: string
      format: uri
      nullable: true
    cityId:
      type: string
      format: uuid
      nullable: true
    interestIds:
      type: array
      items:
        type: string
        format: uuid
    onboardingCompleted:
      type: boolean
    createdAt:
      type: string
      format: date-time

MeResponse:
  type: object
  required: [user]
  properties:
    user:
      $ref: '#/components/schemas/UserProfileView'
