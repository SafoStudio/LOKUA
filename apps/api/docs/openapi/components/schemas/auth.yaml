RegisterRequest:
  type: object
  required:
    - email
    - name
    - password
  properties:
    email:
      type: string
      format: email
      example: user@example.com
    name:
      type: string
      minLength: 1
      maxLength: 100
      example: John Doe
    password:
      type: string
      minLength: 8
      maxLength: 72
      description: Password (8 to 72 UTF-8 characters/bytes)
      example: Password123!

LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      example: user@example.com
    password:
      type: string
      minLength: 1
      maxLength: 72
      example: Password123!

MessageResponse:
  type: object
  required:
    - message
  properties:
    message:
      type: string
      example: Logged out successfully
