type: object
required:
  - challenge
  - response
properties:
  challenge:
    type: string
    description: Challenge received at the /options step
    example: 9k_Jz12v4aQx_...
  response:
    type: object
    required:
      - id
    description: Result of navigator.credentials.create() or navigator.credentials.get() (via @simplewebauthn/browser)
    properties:
      id:
        type: string
        example: Ad_14kL...
      rawId:
        type: string
      response:
        type: object
      type:
        type: string
        example: public-key
    additionalProperties: true
