allOf:
  - $ref: '#/components/schemas/OrganizerRating'
  - type: object
    required: [id, name, avatarUrl, photoUrls, reviews, history]
    properties:
      id: { type: string, format: uuid }
      name: { type: string }
      age: { type: [integer, 'null'], description: Included for authenticated viewers. }
      avatarUrl: { type: [string, 'null'] }
      photoUrls:
        type: array
        maxItems: 3
        description: Profile photos in display order, with the main photo first.
        items: { type: string, format: uri }
      reviews:
        $ref: '#/components/schemas/EventReviewPage'
        description: First three visible reviews. Continue on the organizer reviews endpoint.
      history:
        $ref: '#/components/schemas/OrganizerEventHistoryPage'
        description: First three visible completed events. Continue on the organizer events endpoint.
