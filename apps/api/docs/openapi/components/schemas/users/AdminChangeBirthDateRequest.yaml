type: object
required:
  - birthDate
  - reason
additionalProperties: false
properties:
  birthDate:
    type: string
    format: date
    description: New birth date in ISO `YYYY-MM-DD`. Stored in UTC.
    example: '2000-05-15'
  reason:
    type: string
    minLength: 1
    maxLength: 500
    description: Reason for the change. Written to `audit_logs.reason`.
    example: 'Correcting typo in original registration'
