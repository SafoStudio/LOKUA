type: object
required:
  - id
  - email
  - name
  - interestIds
  - onboardingCompleted
  - createdAt
properties:
  id:
    type: string
    format: uuid
  email:
    type: string
    format: email
  name:
    type: string
  avatarUrl:
    type: string
    format: uri
    nullable: true
  cityId:
    type: string
    format: uuid
    nullable: true
  interestIds:
    type: array
    items:
      type: string
      format: uuid
  onboardingCompleted:
    type: boolean
  createdAt:
    type: string
    format: date-time
