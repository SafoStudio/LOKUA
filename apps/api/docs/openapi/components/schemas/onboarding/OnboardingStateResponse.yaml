type: object
required: [data]
properties:
  data:
    type: object
    required:
      - id
      - currentStep
      - completedSteps
      - completedAt
    properties:
      id:
        type: string
        format: uuid
        example: 123e4567-e89b-12d3-a456-426614174000
      currentStep:
        type: string
        enum: [DATE_OF_BIRTH, PROFILE, CITY, INTERESTS, OPTIONAL, COMPLETED]
        example: CITY
      completedSteps:
        type: array
        items:
          type: string
          enum: [DATE_OF_BIRTH, PROFILE, CITY, INTERESTS, OPTIONAL, COMPLETED]
        example:
          - DATE_OF_BIRTH
          - PROFILE
      completedAt:
        type: string
        format: date-time
        nullable: true
        example: null
      dateOfBirth:
        type: string
        format: date
        nullable: true
        example: '1995-05-15'
      name:
        type: string
        nullable: true
        example: John Doe
      mainPhotoUrl:
        type: string
        format: uri
        nullable: true
        example: https://cdn.example.com/photos/avatar.jpg
      cityId:
        type: string
        format: uuid
        nullable: true
        example: null
      interestIds:
        type: array
        nullable: true
        items:
          type: string
          format: uuid
        example: null
      bio:
        type: string
        nullable: true
        example: null
      languages:
        type: array
        nullable: true
        items:
          type: string
        example: null
      socialLinks:
        type: object
        nullable: true
        additionalProperties:
          type: string
          format: uri
        example: null
    example:
      id: 123e4567-e89b-12d3-a456-426614174000
      currentStep: CITY
      completedSteps:
        - DATE_OF_BIRTH
        - PROFILE
      completedAt: null
      dateOfBirth: '1995-05-15'
      name: John Doe
      mainPhotoUrl: https://cdn.example.com/photos/avatar.jpg
      cityId: null
      interestIds: null
      bio: null
      languages: null
      socialLinks: null
