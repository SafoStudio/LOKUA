type: object
minProperties: 1
properties:
  bio:
    type: string
    maxLength: 300
    nullable: true
    example: 'Board games and running enthusiast'
  languages:
    type: array
    nullable: true
    items:
      type: string
      minLength: 1
      maxLength: 10
    example: ['uk', 'en']
  socialLinks:
    type: object
    nullable: true
    additionalProperties:
      type: string
      format: uri
      pattern: '^https?://'
    example:
      telegram: 'https://t.me/username'
