openapi: 3.1.0

info:
  title: LOKUA API
  version: 1.0.0
  description: |
    ### Frontend Integration

    - **Sign-in and onboarding.** After signing in, call `GET /api/v1/auth/me`.
      See User Profile for onboarding status and steps.
    - **Browsing and joining events.** Start with `GET /api/v1/events`. Event details
      include the viewer's participation status and available actions. Use
      `POST /api/v1/events/{id}/participations` to join directly or submit an application.
    - **Administration.** This section covers the report queue, user management,
      dictionaries, and statistics. These operations require the `ADMIN` role.

    ### Authentication

    For browser requests, use `credentials: 'include'` with Fetch or
    `withCredentials: true` with Axios. The `accessToken` cookie is scoped to
    `/api/v1`, and the `refreshToken` cookie is scoped to `/api/v1/auth`.
    Each operation's security definition shows whether it accepts Bearer authentication.

    ### Responses

    Most operations return `{ "data": ... }`. Paginated lists also include
    `pagination`. Sign-in and `/auth/me` return `{ "user": ... }`.
    Error responses contain `status` and `message`. Validation errors also include `details`.

