openapi: 3.1.0

info:
  title: LOKUA API
  version: 1.0.0
  description: |
    LOKUA events platform API.

    ### Authorization
    Private routes accept an access token via HttpOnly cookie or Bearer header.
    - `accessToken`: valid for the entire API (`Path=/api/v1`).
    - `refreshToken`: valid for all authentication routes (`Path=/api/v1/auth`).

    To work from a browser, you must send `credentials: 'include'` (Fetch) or `withCredentials: true` (Axios).

    ### Response shape
    - Auth success: `{ "user": ... }`
    - Onboarding success: `{ "data": ... }`
    - Events success: `{ "data": ... }` (with `pagination` for the list)
    - Geolocation success: `{ "data": ... }`
    - Errors: `{ "status": "error", "message": "..." }` (plus `details` for validation errors)

servers:
  - url: http://localhost:3003
    description: Local Development Server

