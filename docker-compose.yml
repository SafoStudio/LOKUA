services:
  db:
    image: postgres:16-alpine
    container_name: lokua-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lokua
      POSTGRES_PASSWORD: lokua
      POSTGRES_DB: lokua
    ports:
      - '5432:5432'
    volumes:
      - lokua_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lokua -d lokua']
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    container_name: lokua-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: lokua
      POSTGRES_PASSWORD: lokua
      POSTGRES_DB: lokua_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lokua -d lokua_test']
      interval: 3s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lokua-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - lokua_pgadmin:/var/lib/pgadmin

  minio:
    image: minio/minio:latest
    container_name: lokua-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: lokua
      MINIO_ROOT_PASSWORD: lokua_secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web Console
    volumes:
      - lokua_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: lokua-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lokua lokua_secret &&
      mc mb --ignore-existing local/lokua-uploads &&
      echo 'MinIO bucket lokua-uploads ready.'
      "

volumes:
  lokua_pgdata:
  lokua_pgadmin:
  lokua_minio_data:
